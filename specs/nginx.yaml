# Nginx: nested blocks; any allow/deny at an inner level replaces the parent's list.
name: nginx
config:
  files:
    - name: nginx.conf
      template: |
        daemon off;
        master_process off;
        pid {dir}/nginx.pid;
        error_log {dir}/error.log;
        events { worker_connections 64; }
        http {
          access_log off;
          client_body_temp_path {dir}/tmp-body;
          proxy_temp_path {dir}/tmp-proxy;
          fastcgi_temp_path {dir}/tmp-fastcgi;
          uwsgi_temp_path {dir}/tmp-uwsgi;
          scgi_temp_path {dir}/tmp-scgi;
          auth_basic_user_file {dir}/htpasswd;
          {{http}}
          server {
            listen {host}:{port};
            root {dir}/www;
            {{server}}
            location / {
              {{loc_root}}
            }
            location /admin/ {
              {{loc_admin}}
            }
          }
        }
  sections:
    http: {placeholder: http, line: "{key} {value};", line_flag: "{key};"}
    server: {placeholder: server, line: "{key} {value};", line_flag: "{key};"}
    "loc:/": {placeholder: loc_root, line: "{key} {value};", line_flag: "{key};"}
    "loc:/admin/": {placeholder: loc_admin, line: "{key} {value};", line_flag: "{key};"}
runtime:
  port_base: 18180
  command: [/usr/sbin/nginx, -p, "{dir}", -c, "{dir}/nginx.conf"]
  ready: {type: tcp}
prepare:
  steps:
    - {cmd: [sh, -c, "mkdir -p {dir}/www/admin {dir}/tmp-body {dir}/tmp-proxy {dir}/tmp-fastcgi {dir}/tmp-uwsgi {dir}/tmp-scgi && echo public > {dir}/www/index.html && echo admin-console > {dir}/www/admin/index.html && printf 'auditor:%s\\n' \"$(openssl passwd -apr1 {password})\" > {dir}/htpasswd"], native: true}
properties:
  - id: nginx.version_leak
    description: the Server header discloses the version
    probe: {cmd: [curl, --noproxy, "*", -sS, -o, /dev/null, -D, "-", --max-time, "3", "http://{host}:{port}/"]}
    exposed_if: '(?i)^Server:\s*nginx/\d'
    safe_if: '^HTTP/'
  - id: nginx.admin_open
    description: /admin/ returns 200 without credentials
    probe: {cmd: [curl, --noproxy, "*", -sS, -o, /dev/null, -w, "%{http_code}", --max-time, "3", "http://{host}:{port}/admin/"]}
    exposed_if: '^200$'
    safe_if: '^\d{3}$'
