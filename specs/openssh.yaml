# OpenSSH: first obtained value wins; Match blocks override global settings.
name: openssh
config:
  files:
    - name: sshd_config
      template: |
        Port {port}
        ListenAddress {host}
        HostKey {dir}/hostkey
        UsePAM no
        PidFile {dir}/sshd.pid
        StrictModes no
        KbdInteractiveAuthentication no
        {{global}}
        {{match}}
  sections:
    "": {placeholder: global, line: "{key} {value}"}
  dynamic_sections:
    - {match: "^Match ", placeholder: match, header: "{section}", line: "  {key} {value}"}
parse:
  kind: lines
  section_header: '^(?i:match)\s'
  section_reset: '^(?i:match\s+all)\s*$'
  environment: [port, listenaddress, hostkey, pidfile, include, usepam, hostcertificate, hostkeyagent, addressfamily]
runtime:
  port_base: 12320
  command: [/usr/sbin/sshd, -D, -e, -f, "{dir}/sshd_config"]
  ready: {type: log, marker: "Server listening on"}
prepare:
  steps:
    - {cmd: [sh, -c, "mkdir -p /run/sshd && rm -f {dir}/hostkey {dir}/hostkey.pub && ssh-keygen -q -t ed25519 -N '' -f {dir}/hostkey"], native: true}
properties:
  - id: ssh.password_login
    description: user synthetic logs in with a password and runs a command
    probe:
      cmd: [sshpass, -p, "{password}", ssh, -F, /dev/null, -o, StrictHostKeyChecking=no, -o, UserKnownHostsFile=/dev/null,
            -o, ConnectTimeout=3, -o, BatchMode=no, -o, PreferredAuthentications=password, -o, PubkeyAuthentication=no,
            -o, NumberOfPasswordPrompts=1, -o, LogLevel=ERROR, -p, "{port}", "synthetic@{host}", "echo oracle-ok"]
      timeout: 8
    exposed_if: 'oracle-ok'
    safe_if: 'Permission denied|Connection closed|Received disconnect'
